name: Bug report
description: Report reproducible incorrect behavior in DSHPlugin.
title: "fix: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve DSHPlugin. Do not include secrets or private data.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open …
        2. Search for …
        3. Observe …
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Registry UI
        - Plugin details
        - Catalog data or links
        - Submission or report flow
        - Moderation UI
        - Localization
        - Build or deployment example
        - Other
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: Firefox 128 on Linux
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots are welcome after removing private information.
