name: Feature proposal
description: Suggest an improvement to discovery, ranking, or community workflows.
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What is difficult today, and who is affected?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed direction
      description: Describe the outcome rather than only the implementation.
    validations:
      required: true
  - type: textarea
    id: ecosystem
    attributes:
      label: Ecosystem impact
      description: Could this affect ranking, maintainers, privacy, or moderation?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
