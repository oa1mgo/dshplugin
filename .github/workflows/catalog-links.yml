name: Catalog links

on:
  workflow_dispatch:
    inputs:
      concurrency:
        description: Maximum repositories checked concurrently
        type: choice
        options: ["1", "2", "4"]
        default: "2"
      min_interval_ms:
        description: Minimum milliseconds between GitHub requests (at least 100)
        type: string
        default: "250"
  schedule:
    # First day of each month at 11:23 Asia/Shanghai.
    - cron: "23 3 1 * *"

permissions:
  contents: read

concurrency:
  group: catalog-links
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test link checker
        run: node --test tests/catalog-links.test.mjs
      - name: Validate public repositories
        run: npm run check:catalog-links
        env:
          CATALOG_LINK_CONCURRENCY: ${{ inputs.concurrency || '2' }}
          CATALOG_LINK_MIN_INTERVAL_MS: ${{ inputs.min_interval_ms || '250' }}
